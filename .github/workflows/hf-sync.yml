name: Sync to Hugging Face Space

# Runs when you push to main and change one of the app's files.
# You can also run it by hand from the Actions tab ("Run workflow").
on:
  push:
    branches:
      - main
    paths:
      - 'app.py'
      - 'booktick/**'
      - 'requirements.txt'
      - 'README.md'
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Push app files to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          # Passed through an env var so quotes in a commit message can't break the shell.
          COMMIT_MSG: ${{ github.event.head_commit.message || 'Sync from GitHub' }}
        run: |
          # 1. Clone the Hugging Face Space to a temporary folder
          git clone https://sabarishhh14:${HF_TOKEN}@huggingface.co/spaces/sabarishhh14/BookTick hf-space

          # 2. Copy the app files into the Space
          # (Only these files, so anything that exists only on the Space is left alone.
          # The booktick/ folder is replaced whole, so deleted modules don't linger.)
          cp app.py requirements.txt README.md hf-space/
          rm -rf hf-space/booktick
          cp -r booktick hf-space/
          find hf-space/booktick -name "__pycache__" -type d -prune -exec rm -rf {} +

          # 3. Commit and push the changes back to Hugging Face
          cd hf-space
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add .
          git commit -m "$COMMIT_MSG" || echo "No changes to commit"
          git push
